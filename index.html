<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'PingFang SC','Microsoft YaHei',serif;
  min-height:100vh;
  color:#c8c0b8;
  padding:20px;
  transition:background .6s ease,color .4s ease;
  overflow-x:hidden;
}
#rainCanvas{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
}
#burstLayer{
  position:fixed;
  inset:0;
  z-index:998;
  pointer-events:none;
  overflow:hidden;
}
.burst-text{
  position:absolute;
  white-space:nowrap;
  text-shadow:0 0 8px currentColor;
  animation:burstFly 1.8s ease-out forwards;
}
@keyframes burstFly{
  0%{
    opacity:1;
    transform:translate(0,0) scale(1);
  }
  100%{
    opacity:0;
    transform:translate(var(--tx),var(--ty)) scale(0.2);
  }
}
/* ==========人格解析页面：大背景五颜六色流动渐变========== */
body.parse-mode{
  background: linear-gradient(-45deg, #2b0808,#08182b,#1b2b09,#291030,#0f2e2e);
  background-size:400% 400%;
  animation:gradientShift 12s ease infinite;
  color:#eee;
}
@keyframes gradientShift {
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}
body.parse-mode::before,
body.parse-mode::after{
  display:none !important;
}
/* --------七宗罪分组【红色暗黑风】-------- */
.sin-group-wrap{
  border:1px solid rgba(160,20,20,.45);
  border-radius:16px;
  padding:20px;
  margin-bottom:28px;
  background:rgba(70,10,10,.25);
  box-shadow:0 0 18px rgba(140,0,0,.22);
}
.sin-group-title{
  text-align:center;
  font-size:1.4rem;
  margin-bottom:18px;
  letter-spacing:3px;
  color:#ff7070;
  text-shadow:0 0 10px rgba(180,0,0,.5);
}
.sin-parse-card{
  border-radius:12px;
  padding:14px;
  margin-bottom:14px;
  border:1px solid rgba(150,0,0,.35);
  background:rgba(60,8,8,.35);
}
.sin-parse-card .parse-text-block{
  margin-top:10px;
  line-height:1.8;
  white-space:pre-line;
  color:#ffd2d2;
}
/* --------七美德分组【金黄色神圣风】-------- */
.vir-group-wrap{
  border:1px solid rgba(212,170,60,.45);
  border-radius:16px;
  padding:20px;
  margin-bottom:28px;
  background:rgba(65,50,15,.25);
  box-shadow:0 0 18px rgba(200,150,40,.22);
}
.vir-group-title{
  text-align:center;
  font-size:1.4rem;
  margin-bottom:18px;
  letter-spacing:3px;
  color:#ffdd77;
  text-shadow:0 0 10px rgba(220,170,30,.5);
}
.vir-parse-card{
  border-radius:12px;
  padding:14px;
  margin-bottom:14px;
  border:1px solid rgba(200,155,40,.35);
  background:rgba(55,42,10,.35);
}
.vir-parse-card .parse-text-block{
  margin-top:10px;
  line-height:1.8;
  white-space:pre-line;
  color:#fff1cc;
}
/* ========== 七宗罪主题 ========== */
body.sin-mode{
  background:
    radial-gradient(ellipse at 20% 50%,rgba(120,0,0,.18) 0%,transparent 60%),
    radial-gradient(ellipse at 80% 30%,rgba(90,0,0,.15) 0%,transparent 50%),
    radial-gradient(ellipse at 50% 100%,rgba(70,0,0,.22) 0%,transparent 40%),
    #070707;
}
body.sin-mode::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:1;
  background:
    linear-gradient(180deg, rgba(120,0,0,.35) 0%, rgba(120,0,0,.12) 20%, transparent 40%),
    radial-gradient(circle at 20% 0%, rgba(180,0,0,.25), transparent 25%),
    radial-gradient(circle at 70% 0%, rgba(150,0,0,.22), transparent 28%),
    radial-gradient(circle at 40% 0%, rgba(140,0,0,.18), transparent 22%);
  animation:bloodFloat 6s ease-in-out infinite alternate;
}
@keyframes bloodFloat{
  0%{opacity:.75;filter:blur(.4px)}
  100%{opacity:1;filter:blur(.8px)}
}
body.sin-mode::after{
  content:"";
  position:fixed;
  top:0;left:0;right:0;
  height:12px;
  background:linear-gradient(90deg,transparent 5%,#a50000 25%,#6b0000 50%,#a50000 75%,transparent 95%);
  box-shadow:0 0 24px rgba(180,0,0,.55),0 0 80px rgba(120,0,0,.35);
  pointer-events:none;
  z-index:1000;
  animation:bloodTopPulse 4s ease-in-out infinite;
}
@keyframes bloodTopPulse{
  0%,100%{height:10px;opacity:.85}
  50%{height:16px;opacity:1}
}
.blood-drop{
  position:fixed;
  top:0;
  width:2.5px;
  background:linear-gradient(180deg,#c10000,#600000,transparent);
  filter:blur(.3px);
  z-index:999;
  animation:drip 6s linear infinite;
  box-shadow:0 0 8px rgba(180,0,0,.55);
}
@keyframes drip{
  0%{transform:translateY(0);opacity:.55}
  40%{opacity:.85}
  100%{transform:translateY(110vh);opacity:0}
}
/* ========== 七美德主题 ========== */
body.vir-mode{
  background:
    radial-gradient(ellipse at 50% 0%,rgba(255,255,240,.9) 0%,transparent 55%),
    radial-gradient(ellipse at 25% 80%,rgba(220,200,150,.18) 0%,transparent 45%),
    radial-gradient(ellipse at 75% 85%,rgba(200,180,120,.14) 0%,transparent 40%),
    linear-gradient(160deg,#f7f2e8 0%,#ebe4d4 45%,#ddd4c2 100%);
  color:#3a3530;
}
body.vir-mode::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:1;
  background:
    radial-gradient(circle at 50% 0%,rgba(255,255,255,.9),transparent 30%),
    radial-gradient(circle at 30% 20%,rgba(255,248,220,.6),transparent 25%),
    radial-gradient(circle at 70% 15%,rgba(255,240,200,.5),transparent 22%);
  animation:angelBreath 5s ease-in-out infinite alternate;
}
@keyframes angelBreath{
  0%{opacity:.75}
  100%{opacity:1}
}
body.vir-mode::after{
  content:"";
  position:fixed;
  top:0;left:0;right:0;
  height:4px;
  background:linear-gradient(90deg,transparent 5%,#e6c97a 25%,#fff3c4 50%,#e6c97a 75%,transparent 95%);
  box-shadow:0 0 20px rgba(255,220,140,.55),0 0 70px rgba(200,180,120,.35);
  pointer-events:none;
  z-index:1000;
}
.star{
  position:fixed;
  width:3.5px;
  height:3.5px;
  background:#fffde7;
  border-radius:50%;
  box-shadow:0 0 10px #fff3b0,0 0 22px rgba(255,230,160,.5);
  z-index:999;
  animation:twinkle 3.5s ease-in-out infinite;
}
@keyframes twinkle{
  0%,100%{opacity:.25;transform:scale(.7)}
  50%{opacity:1;transform:scale(1.2)}
}
/* ========== 切换过渡遮罩 ========== */
.theme-transition{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:2000;
  opacity:0;
}
.fire-rise{
  background:linear-gradient(to top, rgba(110,0,0,.9), rgba(70,0,0,.6), rgba(0,0,0,0));
  animation:fireUp 0.8s ease forwards;
}
@keyframes fireUp{
  0%{opacity:0}
  30%{opacity:1}
  100%{opacity:0}
}
.rain-fall{
  background:linear-gradient(to bottom, rgba(200,210,230,.7), rgba(240,235,220,.4), transparent);
  animation:rainDown 0.8s ease forwards;
}
@keyframes rainDown{
  0%{opacity:0}
  30%{opacity:1}
  100%{opacity:0}
}
.container{
  max-width:680px;
  margin:0 auto;
  position:relative;
  z-index:1;
  margin-top:70px;
}
h1{text-align:center;font-size:1.8rem;margin-bottom:4px;letter-spacing:4px;transition:color .4s,text-shadow .4s}
body.sin-mode h1{color:#8b0000;text-shadow:0 0 10px rgba(139,0,0,.8),0 0 30px rgba(139,0,0,.5),0 0 60px rgba(139,0,0,.3),2px 2px 4px rgba(0,0,0,.8);position:relative}
body.sin-mode h1::before{content:'';position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);width:80%;height:2px;background:linear-gradient(90deg,transparent,#8b0000,transparent);box-shadow:0 0 8px rgba(139,0,0,.6)}
body.vir-mode h1{color:#8a6e2f;text-shadow:0 0 10px rgba(200,180,120,.8),0 0 30px rgba(200,180,120,.5),0 0 60px rgba(200,180,120,.3),0 2px 4px rgba(0,0,0,.1);position:relative}
body.vir-mode h1::before{content:'';position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);width:80%;height:2px;background:linear-gradient(90deg,transparent,#c8a060,transparent);box-shadow:0 0 8px rgba(200,180,120,.6)}
.subtitle{text-align:center;margin-bottom:24px;font-size:.82rem;letter-spacing:2px;transition:color .4s}
body.sin-mode .subtitle{color:#6b5b50}
body.vir-mode .subtitle{color:#7a7060}
/* 右上角复用按钮：人格解析 / 返回测试 ——跟随主题颜色 */
.top-right-btn{
  position:fixed;
  top:16px;
  right:16px;
  z-index:100;
  padding:8px 14px;
  border-radius:8px;
  cursor:pointer;
  font-size:0.9rem;
  transition:0.3s;
  backdrop-filter:blur(8px);
}
/* 七宗罪：红色按钮 */
body.sin-mode .top-right-btn{
  background:rgba(120,0,0,.35);
  border:1px solid rgba(180,0,0,.6);
  color:#ffb8b8;
}
body.sin-mode .top-right-btn:hover{
  background:rgba(150,0,0,.55);
  box-shadow:0 0 16px rgba(180,0,0,.6);
}
/* 七美德：金黄色按钮 */
body.vir-mode .top-right-btn{
  background:rgba(190,145,40,.35);
  border:1px solid rgba(220,175,50,.6);
  color:#ffe8a8;
}
body.vir-mode .top-right-btn:hover{
  background:rgba(210,160,45,.55);
  box-shadow:0 0 16px rgba(220,170,40,.6);
}
.theme-btn{
  position:fixed;top:16px;left:16px;z-index:100;
  width:44px;height:44px;border-radius:50%;
  transition:all .3s;display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:1.4rem;backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.15);
}
/* 解析模式、结果页面隐藏左上角主题切换按钮 */
body.parse-mode .theme-btn,
body.show-result-page .theme-btn{
  display:none;
}
body.sin-mode .theme-btn{background:rgba(20,10,10,.8);color:#8b0000}
body.sin-mode .theme-btn:hover{background:rgba(60,10,10,.8);box-shadow:0 0 14px rgba(139,0,0,.5)}
body.vir-mode .theme-btn{background:rgba(255,250,240,.85);color:#c8a060}
body.vir-mode .theme-btn:hover{background:rgba(255,255,250,.9);box-shadow:0 0 14px rgba(200,180,120,.5)}
.card{border-radius:12px;padding:20px;margin-bottom:12px;transition:all .4s}
body.sin-mode .card{background:rgba(20,10,10,.6);backdrop-filter:blur(8px);border:1px solid rgba(139,0,0,.25);box-shadow:0 2px 16px rgba(0,0,0,.5)}
body.sin-mode .card:hover{border-color:rgba(139,0,0,.45)}
body.vir-mode .card{background:rgba(255,250,240,.7);backdrop-filter:blur(8px);border:1px solid rgba(200,180,120,.3);box-shadow:0 2px 16px rgba(0,0,0,.06)}
body.vir-mode .card:hover{border-color:rgba(200,180,120,.5)}
.q-title{font-weight:600;margin-bottom:10px;font-size:.95rem;border-left:3px solid;padding-left:10px;transition:color .4s,border-color .4s}
body.sin-mode .q-title{color:#d4c8c0;border-color:#8b0000}
body.vir-mode .q-title{color:#3a3530;border-color:#8a6e2f}
.options{display:flex;flex-direction:column;gap:7px}
.option{display:flex;align-items:center;border-radius:8px;padding:9px 12px;cursor:pointer;transition:.25s;font-size:.9rem;border:1.5px solid}
body.sin-mode .option{background:rgba(40,15,15,.5);border-color:rgba(139,0,0,.15);color:#a89890}
body.sin-mode .option:hover{background:rgba(60,10,10,.5);border-color:rgba(139,0,0,.4);color:#d4c8c0}
body.sin-mode .option.selected{border-color:#8b0000;background:rgba(139,0,0,.12);color:#e0d0c8;box-shadow:0 0 12px rgba(139,0,0,.2)}
body.vir-mode .option{background:rgba(255,250,240,.6);border-color:rgba(200,180,120,.25);color:#5a5040}
body.vir-mode .option:hover{background:rgba(255,250,240,.8);border-color:rgba(200,180,120,.45);color:#3a3530}
body.vir-mode .option.selected{border-color:#8a6e2f;background:rgba(200,180,120,.15);color:#3a3530;box-shadow:0 0 12px rgba(200,180,120,.2)}
.option input{display:none}
.radio{width:14px;height:14px;border-radius:50%;margin-right:10px;flex-shrink:0;position:relative;transition:.25s}
body.sin-mode .radio{border:2px solid #5a4a42}
body.sin-mode .option.selected .radio{border-color:#8b0000}
body.sin-mode .option.selected .radio::after{content:'';position:absolute;top:2px;left:2px;width:6px;height:6px;border-radius:50%;background:#8b0000;box-shadow:0 0 6px rgba(139,0,0,.6)}
body.vir-mode .radio{border:2px solid #a09880}
body.vir-mode .option.selected .radio{border-color:#8a6e2f}
body.vir-mode .option.selected .radio::after{content:'';position:absolute;top:2px;left:2px;width:6px;height:6px;border-radius:50%;background:#8a6e2f;box-shadow:0 0 6px rgba(200,180,120,.5)}
.btn{display:block;width:100%;padding:13px;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;transition:.25s;margin-top:16px;letter-spacing:2px}
body.sin-mode .btn-primary{background:linear-gradient(135deg,#8b0000,#5c0000);color:#d4c8c0;border:1px solid rgba(139,0,0,.4);box-shadow:0 4px 16px rgba(139,0,0,.3)}
body.sin-mode .btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(139,0,0,.5)}
body.vir-mode .btn-primary{background:linear-gradient(135deg,#c8a060,#a08040);color:#fff;border:1px solid rgba(200,180,120,.5);box-shadow:0 4px 16px rgba(200,180,120,.3)}
body.vir-mode .btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(200,180,120,.5)}
.btn-primary:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}
body.sin-mode .btn-secondary{background:rgba(40,15,15,.6);color:#c8a0a0;border:1px solid rgba(139,0,0,.3);margin-top:10px}
body.sin-mode .btn-secondary:hover{background:rgba(60,20,20,.6)}
body.vir-mode .btn-secondary{background:rgba(255,250,240,.6);color:#6a6050;border:1px solid rgba(200,180,120,.3);margin-top:10px}
body.vir-mode .btn-secondary:hover{background:rgba(255,250,240,.8)}
.progress-wrap{margin:16px 0}
.progress-bar{height:4px;border-radius:2px;background:rgba(80,80,80,.2);overflow:hidden}
.progress-fill{height:100%;transition:.3s ease}
body.sin-mode .progress-fill{background:#8b0000}
body.vir-mode .progress-fill{background:#c8a060}
.progress-text{font-size:0.8rem;margin-top:4px;text-align:right}
/* 结果页样式 */
.result-card{padding:24px;border-radius:14px;margin-top:20px}
body.sin-mode .result-card{background:rgba(20,10,10,.65);border:1px solid rgba(139,0,0,.3)}
body.vir-mode .result-card{background:rgba(255,250,240,.75);border:1px solid rgba(200,180,120,.4)}
.result-title{text-align:center;font-size:1.3rem;margin-bottom:16px;font-weight:bold}
.dim-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed rgba(128,128,128,.25)}
.dim-name{font-size:0.95rem}
.dim-score{font-weight:bold}
.desc-text{margin-top:18px;line-height:1.7;font-size:0.92rem}
/* 人格总结卡片，新格式 */
.personality-card{
  margin-top:16px;padding:18px;border-radius:12px;
  border:1px solid;
  white-space:pre-line;
  line-height:1.8;
}
body.sin-mode .personality-card{
  background:rgba(139,0,0,.12);
  border-color:rgba(139,0,0,.4);
  box-shadow:0 0 18px rgba(139,0,0,.25);
}
body.vir-mode .personality-card{
  background:rgba(200,180,120,.15);
  border-color:rgba(200,180,120,.45);
  box-shadow:0 0 18px rgba(200,180,120,.25);
}
/* 视频样式 */
.video-box{margin-top:16px;border-radius:10px;overflow:hidden}
video{width:100%;display:block;object-fit:cover}
.video-tip{
  text-align:center;
  margin-top:8px;
  font-size:0.9rem;
  line-height:2.2;
}
body.sin-mode .video-tip{
  color:#c8c0b8;
}
body.vir-mode .video-tip{
  color:#3a3530;
}
.flex-1{
  flex:1;
}
.btn-row{
  display:flex;
  gap:10px;
  margin-top:16px;
}
/* 切换测试按钮，答题页面默认隐藏 */
#switchOtherTestBtn{
  display:none;
}
body.show-result-page #switchOtherTestBtn{
  display:block;
}
/* --------人格解析页面视图样式【删掉独立返回按钮】-------- */
#parseView{
  display:none;
  max-width:720px;
  margin:0 auto;
  position:relative;
  z-index:1;
  margin-top:70px;
  padding-bottom:40px;
}

<script>
function shuffleArray(arr){
  const temp = [...arr];
  for(let i = temp.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [temp[i], temp[j]] = [temp[j], temp[i]];
  }
  return temp;
}
const videoObserver = new IntersectionObserver((entries)=>{
  entries.forEach(entry=>{
    const vid = entry.target;
    if(!entry.isIntersecting){
      if(!vid.paused){
        vid.pause();
      }
    }
  })
},{threshold:0.05});
function observeAllVideo(){
  document.querySelectorAll("video").forEach(v=>{
    videoObserver.observe(v);
  })
}
const canvas = document.getElementById('rainCanvas');
const ctx = canvas.getContext('2d');
let rainList = [];
const rainCount = 45;
let isVirtue = false;
let singleRainWord = "";
const sinWords = ["傲慢","嫉妒","暴怒","懒惰","贪婪","暴食","色欲"]
const virWords = ["谦卑","宽容","耐心","勤勉","慷慨","节制","贞洁"]
const parseAllWords = ["傲慢","嫉妒","暴怒","懒惰","贪婪","暴食","色欲","谦卑","宽容","耐心","勤勉","慷慨","节制","贞洁"]
let rainWordPool = sinWords;

class RainItem{
  constructor(){
    this.reset();
  }
  reset(){
    const pool = singleRainWord ? [singleRainWord] : rainWordPool;
    this.word = pool[Math.floor(Math.random()*pool.length)];
    this.x = Math.random() * canvas.width;
    this.y = Math.random()*-canvas.height;
    this.speed = Math.random()*2+1;
    this.size = Math.random()*24+12;
    this.opacity = Math.random()*0.4+0.3;
  }
  update(){
    this.y += this.speed;
    if(this.y>canvas.height){
      this.reset();
    }
  }
  draw(){
    ctx.save();
    if(document.body.classList.contains("parse-mode")){
      const r = Math.floor(Math.random()*180+75);
      const g = Math.floor(Math.random()*180+75);
      const b = Math.floor(Math.random()*220+35);
      ctx.fillStyle = `rgba(${r},${g},${b},${this.opacity})`;
      ctx.shadowColor=`rgb(${r},${g},${b})`;
    }else if(isVirtue){
     
      ctx.fillStyle = `rgba(148,108,0,${this.opacity})`;
      ctx.shadowColor="#946c00";
    }else{
      
      ctx.fillStyle = `rgba(180,0,0,${this.opacity})`;
      ctx.shadowColor="#990000";
    }
    ctx.shadowBlur=12;
    ctx.font = this.size+"px Microsoft YaHei";
    ctx.fillText(this.word,this.x,this.y);
    ctx.restore();
  }
}
function resizeCanvas(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize',resizeCanvas);
function initRain(){
  rainList=[];
  for(let i=0;i<rainCount;i++){
    rainList.push(new RainItem());
  }
}
function animateRain(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  rainList.forEach(item=>{
    item.update();
    item.draw();
  })
  requestAnimationFrame(animateRain);
}
initRain();
animateRain();

function burstWords(word){
  const layer = document.getElementById("burstLayer");
  layer.innerHTML="";
  for(let i=0;i<22;i++){
    const el = document.createElement("div");
    el.className="burst-text";
    el.innerText = word;
    el.style.color = isVirtue ? "#946c00" : "#bb0000";
    const angle = Math.random()*Math.PI*2;
    const dist = 80 + Math.random()*220;
    el.style.setProperty("--tx",Math.cos(angle)*dist+"px");
    el.style.setProperty("--ty",Math.sin(angle)*dist+"px");
    el.style.left = "50%";
    el.style.top = "50%";
    el.style.fontSize = (Math.random()*22+14)+"px";
    layer.appendChild(el);
  }
  setTimeout(()=>layer.innerHTML="",1900);
}

let currentPool;
let currentMeta;
let answers = [];
let currentQ = 0;
const qBox = document.getElementById('qBox');
const resultBox = document.getElementById('resultBox');
const nextBtn = document.getElementById('nextBtn');
const prevBtn = document.getElementById('prevBtn');
const restartBtn = document.getElementById('restartBtn');
const progressFill = document.getElementById('progressFill');
const progressText = document.getElementById('progressText');

function updateNavButton(){
  prevBtn.disabled = (currentQ === 0);
  if(currentQ >= currentPool.length -1){
    nextBtn.innerText = "提交查看结果";
  }else{
    nextBtn.innerText = "下一题";
  }
}

function renderQuestion(){
  const q = currentPool[currentQ];
  qBox.innerHTML = `
    <div class="card">
      <div class="q-title">${q.title}</div>
      <div class="options">
        ${q.opts.map((opt,i)=>`
          <label class="option ${answers[currentQ]===i?'selected':''}">
            <input type="radio" name="q${currentQ}" value="${i}" ${answers[currentQ]===i?'checked':''}>
            <span class="radio"></span>
            ${opt}
          </label>
        `).join('')}
      </div>
    </div>
  `;
  document.querySelectorAll('.option').forEach((el,idx)=>{
    el.onclick = ()=>{
      answers[currentQ] = idx;
      document.querySelectorAll('.option').forEach(e=>e.classList.remove('selected'));
      el.classList.add('selected');
      nextBtn.disabled = false;
    }
  })
  updateProgress();
  updateNavButton();
}
function updateProgress(){
  const total = currentPool.length;
  const done = answers.filter(x=>x!==undefined).length;
  progressFill.style.width = `${done/total*100}%`;
  progressText.innerText = `${currentQ+1} / ${total}`;
}

function calcResult(){
  const scores = [0,0,0,0,0,0,0];
  answers.forEach((v,i)=>{
    const item = currentPool[i];
    let scoreVal = v;
    if(item.isReverse){
      scoreVal = 4 - v;
    }
    scores[item.dim] += (scoreVal+1);
  })
  return scores;
}

function checkCareless(){
  const filled = answers.filter(x=>x!==undefined);
  if(filled.length < 4) return false;
  const first = filled[0];
  return filled.every(x=>x===first);
}

function showResult(){
  if(checkCareless()){
    alert("检测到你全部选择同一个选项，建议重新认真作答，测试结果仅供娱乐。");

  const scores = calcResult();

    <div class="result-title">你的测评结果</div>`;

    html += `<div class="dim-item"><span class="dim-name">${currentMeta[i].name}</span><span class="dim-score">${s}</span></div>`
  })
  html += `<div class="desc-text">根据你答题分数判定你的人格为：</div>`;
  const maxIdx = scores.indexOf(Math.max(...scores));

  let fullData;
  if(isVirtue){
    fullData = virMetaParse[maxIdx];
  }else{
    fullData = sinMetaParse[maxIdx];
  }

  singleRainWord = fullData.name;
  rainList.forEach(r=>r.reset());
  burstWords(fullData.name);

  let resultTextBlock;

    resultTextBlock = `人格：${fullData.name} ${fullData.enName}
天使：${fullData.being}

解析：${fullData.desc}`;

  html += `

  if(currentQ>0){
    currentQ--;

  }

nextBtn.onclick = function(){

    showResult();

    renderQuestion();
    nextBtn.disabled = answers[currentQ]===undefined;
